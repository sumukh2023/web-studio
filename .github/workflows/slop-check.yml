name: Slop check (impeccable)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  detect:
    name: impeccable detect src/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run impeccable slop detector
        run: npx --yes impeccable@2.3.2 detect src/
  design-process:
    name: design-process gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Fails a themed build that reuses the example skeleton, uses no motion
      # primitives, or ships without a ui-ux-pro-max design brief.
      - name: Verify design process
        run: node scripts/verify-design-process.mjs
